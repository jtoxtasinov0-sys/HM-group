<!doctype html>
<html><head><meta charset="utf-8"><title>viewer</title>
<style>html,body{margin:0;height:100%;background:#222;overflow:hidden;font:12px monospace;color:#fff}#info{position:fixed;top:8px;left:8px;white-space:pre}</style>
</head><body><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x333333);
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 2000);
const q = new URLSearchParams(location.search);
const ids = (q.get('m') || 'g63').split(',');
const view = q.get('v') || 'side';
const ctl = new OrbitControls(cam, r.domElement);
sc.add(new THREE.GridHelper(20, 20, 0x666666, 0x444444));
sc.add(new THREE.AxesHelper(3));
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
let x = 0; const lines = []; let maxDim = 0;
for (const id of ids) {
  const g = await loader.loadAsync(`/models/${id}.glb`);
  const o = g.scene; o.name = id; o.position.x = x; sc.add(o);
  const b = new THREE.Box3().setFromObject(o); const s = b.getSize(new THREE.Vector3());
  maxDim = Math.max(maxDim, s.x, s.y, s.z); lines.push(`${id}: ${s.x.toFixed(2)} x ${s.y.toFixed(2)} x ${s.z.toFixed(2)}`);
  x += Math.max(s.x, 2.6) + 0.6;
}
const span = x;
const cx = (span - 3) / 2;
const d = Math.max(span, 6, maxDim) * 1.25 * (+q.get('z') || 1);
if (view === 'side') cam.position.set(cx, 1.5, d); else if (view === 'front') cam.position.set(cx, 2, d).applyAxisAngle(new THREE.Vector3(0,1,0), 0); else cam.position.set(cx + d * 0.6, d * 0.4, d * 0.7);
if (view === 'top') cam.position.set(cx, d, 0.01);
ctl.target.set(cx, 0.8, 0); ctl.update();
document.getElementById('info').textContent = lines.join('\n') + '\n+Z = towards viewer in side view? axes: red X, green Y, blue Z';
r.setAnimationLoop(() => r.render(sc, cam));
window.__ready = true; window.sc = sc; window.THREE = THREE;
</script></body></html>
