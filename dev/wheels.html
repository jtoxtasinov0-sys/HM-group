<!doctype html>
<html><head><meta charset="utf-8"><title>wheels</title>
<style>html,body{margin:0;background:#eee;font:12px monospace}canvas{display:block}#log{position:fixed;top:4px;left:4px;white-space:pre}</style>
</head><body><div id="log"></div>
<script type="module">
// G'ildirak o'qlarini tekshirish: http://localhost:5173/dev/wheels.html  (?m=g63&r=0.4)
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { CARS } from '/src/data/cars.js';
import { rigWheels } from '/src/three/wheels.js';

const q = new URLSearchParams(location.search);
const ids = (q.get('m') || CARS.filter((c) => c.garage).map((c) => c.id).join(',')).split(',');
const W = 1400, H = 700;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(W, H);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f2f2f2');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.03).texture;
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cols = 2, cellW = 6.2, cellH = 2.4;
const lines = [];
const rigs = [];
for (let k = 0; k < ids.length; k++) {
  const car = CARS.find((c) => c.id === ids[k]);
  const g = await loader.loadAsync(`/models/${car.id}.glb`);
  const model = g.scene;
  const holder = new THREE.Group();
  holder.add(model);
  holder.rotation.y = q.get('back') ? -Math.PI / 2 : Math.PI / 2; // yon ko'rinish: old tomoni o'ngda
  holder.position.set((k % cols) * cellW, -Math.floor(k / cols) * cellH, 0);
  scene.add(holder);
  const rig = rigWheels(model, car.wheels);
  rigs.push(rig);
  for (const w of rig.wheels) {
    const ring = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(Array.from({ length: 64 }, (_, i) => new THREE.Vector3(0, Math.sin(i / 64 * Math.PI * 2) * rig.radius, Math.cos(i / 64 * Math.PI * 2) * rig.radius))),
      new THREE.LineBasicMaterial({ color: '#ff0040', depthTest: false }),
    );
    ring.position.copy(w.steer.position);
    ring.position.x = Math.sign(w.steer.position.x) * 1.3;
    model.add(ring);
  }
  lines.push(`${car.id}: r=${rig.radius.toFixed(3)} axles ${rig.wheels.map((w) => w.steer.position.z.toFixed(2)).join(',')} spinTris=${rig.stats.spin} steerTris=${rig.stats.steer}`);
}
document.getElementById('log').textContent = lines.join('\n');
const one = ids.length === 1;
const vh = one ? 1.15 : 3.7;
const cam = new THREE.OrthographicCamera(-W / H * vh, W / H * vh, vh, -vh, 0.1, 100);
const cy = one ? 0.95 : -cellH + 0.9, cx = one ? 0 : cellW / 2;
cam.position.set(cx, cy, 30);
cam.lookAt(cx, cy, 0);
const spin = q.get('spin');
r.setAnimationLoop((t) => {
  if (spin) rigs.forEach((rig) => { rig.roll(0.03); rig.steer(Math.sin(t / 900) * 0.5); });
  r.render(scene, cam);
});
window.__ready = true;
</script></body></html>
